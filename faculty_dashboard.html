<!DOCTYPE html>
<html>
<head>
    <title>Faculty Dashboard -AMS</title>
    <link rel="icon" href="https://img.icons8.com/stencil/32/checkmark.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <h1 class="dashboard-title"><i class="fas fa-chalkboard-teacher"></i> Faculty Dashboard</h1>
        <div class="cards">
            <div class="card" onclick="window.location.href='mark_attendance.html'">
                <h2>Mark Attendance</h2>
                <p>Mark attendance for students.</p>
            </div>
            <div class="card" onclick="window.location.href='view_attendance.html'">
                <h2>View Attendance</h2>
                <p>View attendance records.</p>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authenticated = sessionStorage.getItem('authenticated');
            const role = sessionStorage.getItem('role');
    
            if (!authenticated || !role) {
                alert('You are not authorized to view this page. Please log in.');
                window.location.href = 'index.html';
            }
        });
        document.addEventListener('contextmenu', function(event) {

event.preventDefault();
});

    </script>
</body>
</html>
