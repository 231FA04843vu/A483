<!DOCTYPE html>
<html>
<head>
    <title>Faculty Dashboard - AMS</title>
    <link rel="icon" href="https://img.icons8.com/stencil/32/checkmark.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 24px;
            z-index: 1000; 
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <div class="dashboard-container">
        <h1 class="dashboard-title"><i class="fas fa-chalkboard-teacher"></i> Faculty Dashboard</h1>
        <div class="cards">
            <div class="card" onclick="window.location.href='mark_attendance.html'">
                <h2>Mark Attendance</h2>
                <p>Mark attendance for students.</p>
            </div>
            <div class="card" onclick="window.location.href='view_attendance.html'">
                <h2>View Attendance</h2>
                <p>View attendance records.</p>
            </div>
        </div>
    </div>
    <script>
        
        function goBack() {
            window.history.back();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const authenticated = sessionStorage.getItem('authenticated');
            const role = sessionStorage.getItem('role');
    
            if (!authenticated || !role) {
                alert('You are not authorized to view this page. Please log in.');
                window.location.href = 'index.html';
            }
        });

        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
        });
    </script>
</body>
</html>
