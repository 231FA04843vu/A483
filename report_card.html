<!DOCTYPE html>
<html>
<head>
    <title>View Report Card - AMS</title>
    <link rel="icon" href="https://img.icons8.com/stencil/32/checkmark.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .report-card-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .report-card-container h1 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-button i {
            margin-right: 8px;
        }

        .submit-button:hover {
            background-color: #0056b3;
        }

        .attendance-result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .subject-attendance {
            margin-top: 10px;
            font-size: 16px;
            color: #555;
        }
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 24px;
            z-index: 1000; /* Ensure the button is on top */
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <div class="report-card-container">
        <h1><i class="fas fa-file-alt"></i> View Report Card</h1>
        <form id="reportCardForm">
            <div class="form-group">
                <label for="rollNumber">Enter Roll Number</label>
                <input type="text" id="rollNumber" name="rollNumber" required>
            </div>
            <button type="submit" class="submit-button"><i class="fas fa-search"></i> View Attendance</button>
        </form>
        <div id="attendanceResult" class="attendance-result"></div>
        <div id="subjectAttendance" class="subject-attendance"></div>
    </div>
    <script>
        // Define the goBack function
        function goBack() {
            window.history.back();
        }
    </script>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDHD1hv7mERPzWNkStnJ9eKI7HquS05Deo",
            authDomain: "attendance-management-system-v.firebaseapp.com",
            projectId: "attendance-management-system-v",
            storageBucket: "attendance-management-system-v.appspot.com",
            messagingSenderId: "446562547736",
            appId: "1:446562547736:web:85dcee5d92ea727acf6b6d",
            measurementId: "G-VYFNPC5XFL"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Function to get data from Firebase
        async function getData(path) {
            const dbRef = ref(database);
            const snapshot = await get(child(dbRef, path));
            return snapshot.exists() ? snapshot.val() : [];
        }

        document.getElementById('reportCardForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const rollNumber = document.getElementById('rollNumber').value;
            const attendanceData = await getData('attendanceData');
            const totalClassesData = await getData('totalClassesData');
            const studentAttendanceData = attendanceData.filter(record => record.rollNumber === rollNumber);

            if (studentAttendanceData.length === 0) {
                document.getElementById('attendanceResult').innerText = 'Student data not found.';
                document.getElementById('subjectAttendance').innerHTML = '';
                return;
            }

            const totalClasses = studentAttendanceData.length;
            const attendedClasses = studentAttendanceData.filter(record => record.status === 'Present').length;
            const attendancePercentage = totalClasses > 0 ? (attendedClasses / totalClasses) * 100 : 0;

            document.getElementById('attendanceResult').innerText = `Total Attendance Percentage: ${attendancePercentage.toFixed(2)}%`;

            const subjects = ['DAA', 'OS', 'TOC', 'COA'];
            let subjectAttendanceHTML = '';

            subjects.forEach(subject => {
                const totalSubjectClasses = totalClassesData[subject] || 0;
                const attendedSubjectClasses = studentAttendanceData.filter(record => record.subject === subject && record.status === 'Present').length;
                const subjectAttendancePercentage = totalSubjectClasses > 0 ? (attendedSubjectClasses / totalSubjectClasses) * 100 : 0;
                subjectAttendanceHTML += `<p>${subject}: ${subjectAttendancePercentage.toFixed(2)}% (Total Classes: ${totalSubjectClasses}, Attended: ${attendedSubjectClasses})</p>`;
            });

            document.getElementById('subjectAttendance').innerHTML = subjectAttendanceHTML;
        });
        
    document.addEventListener('DOMContentLoaded', () => {
        const authenticated = sessionStorage.getItem('authenticated');
        const role = sessionStorage.getItem('role');

        if (!authenticated || !role) {
            alert('You are not authorized to view this page. Please log in.');
            window.location.href = 'index.html';
        }
    });
    document.addEventListener('contextmenu', function(event) {

event.preventDefault();

});

    </script>
</body>
</html>
