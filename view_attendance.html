<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Attendance - AMS</title>
    <link rel="icon" href="https://img.icons8.com/stencil/32/checkmark.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .attendance-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
            text-align: center;
            height: auto; 
            display: flex;
            flex-direction: column;
        }
        .attendance-container h1 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #333;
        }
        .clear-button {
            margin-left: 20px; 
            padding: 7px 7px;
            background-color: #dc3545; 
            color: white;
            border: none;
            border-radius: 45px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            width: 220px;
        }
        .clear-button:hover {
            background-color: #c82333; 
        }
        .section-select-container {
            margin-top: 20px; 
            text-align: left; 
        }
        .table-container {
            flex-grow: 1;
            overflow-y: auto; 
            max-height: 60vh;
        }
        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .attendance-table th, .attendance-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .attendance-table th {
            background-color: #007bff;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0; 
            z-index: 1;
        }
        .attendance-table tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .attendance-table tr:hover {
            background-color: #ddd;
        }
        .status-present {
            background-color: #d4edda;
        }
        .status-absent {
            background-color: #f8d7da; 
        }
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 24px;
            z-index: 1000; 
        }
        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <div class="attendance-container">
        <h1><i class="fas fa-calendar-check"></i> Attendance Details</h1>
        <button class="clear-button" onclick="clearAttendanceData()">Clear Attendance Data</button>
        <div class="section-select-container">
            <label for="sectionSelect">Select Section:</label>
            <select id="sectionSelect" onchange="fetchSectionAttendance()">
                <option value="">-- Select Section --</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
            </select>
        </div>
        <div class="table-container">
            <table class="attendance-table">
                <thead>
                    <tr>
                        <th>Roll Number</th>
                        <th>Period</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                   
                </tbody>
            </table>
        </div>
    </div>
    <script>
       
        function goBack() {
            window.history.back();
        }
        </script>
    <script type="module">
       
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getDatabase, ref, get, query, orderByChild, equalTo, set } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js";      
        const firebaseConfig = {
            apiKey: "AIzaSyDHD1hv7mERPzWNkStnJ9eKI7HquS05Deo",
            authDomain: "attendance-management-system-v.firebaseapp.com",
            projectId: "attendance-management-system-v",
            storageBucket: "attendance-management-system-v.appspot.com",
            messagingSenderId: "446562547736",
            appId: "1:446562547736:web:85dcee5d92ea727acf6b6d",
            measurementId: "G-VYFNPC5XFL",
            databaseURL: "https://attendance-management-system-v-default-rtdb.firebaseio.com/" // Ensure this is correct
        };
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);      
        async function fetchSectionAttendance() {
            const selectedSection = document.getElementById('sectionSelect').value;
            const attendanceTableBody = document.getElementById('attendanceTableBody');
            attendanceTableBody.innerHTML = ''; 
            if (selectedSection) {
                try {
                    const attendanceRef = ref(database, 'attendanceData');
                    const studentsRef = ref(database, 'students');
                    const [attendanceSnapshot, studentsSnapshot] = await Promise.all([get(attendanceRef), get(studentsRef)]);

                    if (attendanceSnapshot.exists() && studentsSnapshot.exists()) {
                        const attendanceData = attendanceSnapshot.val();
                        const studentsData = studentsSnapshot.val();

                        const filteredData = Object.values(attendanceData).filter(record => {
                            const student = Object.values(studentsData).find(student => student.rollNumber === record.rollNumber);
                            return student && student.section === selectedSection;
                        });

                        if (filteredData.length > 0) {
                            filteredData.forEach(record => {
                                const row = document.createElement('tr');
                                const statusClass = record.status === 'Present' ? 'status-present' : 'status-absent';
                                row.innerHTML = `
                                    <td>${record.rollNumber}</td>
                                    <td>${record.period}</td>
                                    <td>${record.subject}</td>
                                    <td>${record.date}</td>
                                    <td class="${statusClass}">${record.status}</td>
                                `;
                                attendanceTableBody.appendChild(row);
                            });
                        } else {
                            console.log('No attendance data found for this section.');
                        }
                    } else {
                        console.log('No attendance data found.');
                    }
                } catch (error) {
                    console.error('Error fetching attendance data:', error);
                }
            }
        } 
        async function clearAttendanceData() {
            const attendanceRef = ref(database, 'attendanceData'); 
            try {
                await set(attendanceRef, null); 
                alert('All attendance data has been cleared.');
                document.getElementById('attendanceTableBody').innerHTML = ''; 
            } catch (error) {
                console.error('Error clearing attendance data:', error);
            }
        }    
        window.fetchSectionAttendance = fetchSectionAttendance;
        window.clearAttendanceData = clearAttendanceData;    
        document.addEventListener('DOMContentLoaded', () => {
            
        });
        document.addEventListener('DOMContentLoaded', () => {
        const authenticated = sessionStorage.getItem('authenticated');
        const role = sessionStorage.getItem('role');

        if (!authenticated || !role) {
            alert('You are not authorized to view this page. Please log in.');
            window.location.href = 'index.html';
        }
    });
    document.addEventListener('contextmenu', function(event) {

event.preventDefault();

});
    </script>
</body>
</html>
